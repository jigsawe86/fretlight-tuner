<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1c20">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;600;700&display=swap"><title>Fretlight — Tuner</title>
<style>:root{--bg:#0b0d12;--card:#141824;--line:#232a3a;--txt:#eef1f8;--mut:#8a93a8;--dim:#5c6680;--acc:#7c8cff;--ok:#2ee59d;--warn:#ffb547;--bad:#ff5d73}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(120% 70% at 50% 0%,#1a2033 0%,var(--bg) 60%) fixed;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button,select,input{font-family:inherit}
.app{max-width:480px;margin:0 auto;height:100dvh;min-height:600px;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 20px 0}
header{display:flex;align-items:center;gap:10px;padding:14px 0 4px}
.logo{width:30px;height:30px;flex:none}
.instbtn{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--txt);cursor:pointer;padding:4px 2px;min-width:0}
.instbtn b{font-size:18px;white-space:nowrap}.instbtn span{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.instbtn svg{flex:none;color:var(--mut)}
.hgap{flex:1}
.iconbtn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--txt);display:grid;place-items:center;cursor:pointer;transition:transform .15s,border-color .2s;flex:none}
.iconbtn:active{transform:scale(.92)}.iconbtn.on{border-color:var(--acc);color:var(--acc)}
.modes{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:8px}
.seg{display:flex;background:#ffffff08;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--mut);font-weight:600;font-size:12.5px;padding:7px 13px;border-radius:999px;cursor:pointer;transition:.25s}
.seg button.on{background:var(--acc);color:#fff;box-shadow:0 4px 16px #7c8cff55}
.vbtn{border:1px solid var(--line);background:#ffffff08;color:var(--mut);border-radius:999px;height:36px;padding:0 12px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.vbtn.on{color:var(--warn);border-color:#ffb54766;background:#ffb54714}
/* hero */
.hero{flex:.8 1 0;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:clamp(8px,2vh,22px);min-height:0}
.note{text-align:center;font-size:96px;font-weight:800;line-height:1;letter-spacing:-3px;transition:color .3s,text-shadow .3s}
.note sub{font-size:26px;font-weight:600;color:var(--mut);letter-spacing:0;margin-left:2px}
.in .note{color:var(--ok);text-shadow:0 0 28px #2ee59d88}
.cbar,.strobe{width:100%;max-width:340px;margin:clamp(16px,3vh,28px) auto 0}
.ctrack{position:relative;height:14px;border-radius:999px;background:linear-gradient(90deg,#ff5d7340,#ffb54726 30%,#1d2333 45%,#1d2333 55%,#ffb54726 70%,#ff5d7340);border:1px solid var(--line)}
.czone{position:absolute;left:45%;width:10%;top:-1px;bottom:-1px;border-radius:6px;background:#2ee59d2e;border:1px solid #2ee59d66;transition:background .3s,box-shadow .3s}
.cticks{position:absolute;inset:3px 0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),#ffffff1a calc(10% - 1px) 10%)}
.cmid{position:absolute;left:50%;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--ok);border-radius:2px}
.cind{position:absolute;top:50%;left:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--txt);box-shadow:0 2px 10px #0008}
.in .czone{background:#2ee59d55;box-shadow:0 0 22px #2ee59d66}.in .cind{background:var(--ok);box-shadow:0 0 16px #2ee59d}
.clbl{display:flex;justify-content:space-between;margin-top:9px;font-size:11px;color:var(--dim);padding:0 2px}
.strobe{display:none;position:relative;height:46px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0e1119}
.strobe canvas{width:100%;height:100%;display:block}.strobe:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:#ffffff40}
.in .strobe{border-color:#2ee59d88;box-shadow:0 0 22px #2ee59d44}
.strobe-on .strobe{display:block}.strobe-on .cbar{display:none}
.meta{text-align:center;margin-top:12px;color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums;min-height:18px}
.status{height:20px;text-align:center;font-weight:700;font-size:13.5px;letter-spacing:.5px;margin-top:6px}
/* controls */
.controls{flex:1.3 1 0;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(10px,1.8vh,18px);padding:clamp(6px,1.5vh,14px) 0 clamp(12px,2.4vh,22px);min-height:0}
.tunebar{display:flex;gap:9px;align-items:center}
.pill{position:relative;flex:1;min-width:0}
.pill select{appearance:none;-webkit-appearance:none;width:100%;height:44px;border-radius:999px;padding:0 36px 0 16px;background:linear-gradient(180deg,#1c2232,#141824);border:1px solid #2c3448;color:var(--txt);font-weight:600;font-size:14px;text-overflow:ellipsis}
.pill select:focus{outline:none;border-color:var(--acc)}
.pill:after{content:"";position:absolute;right:16px;top:50%;width:7px;height:7px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.tb{flex:none;height:44px;border:1px solid #2c3448;background:#141824;color:var(--txt);border-radius:999px;padding:0 14px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.tb[hidden]{display:none}.tb:active{transform:scale(.95)}.tb.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tb.save{background:linear-gradient(135deg,#2ee59d,#22b8a0);border:0;color:#06281c}
.tb.fine.on{background:#ffb54722;border-color:var(--warn);color:var(--warn)}.tb.del{color:var(--bad)}
.subinfo{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.subinfo:empty{display:none}
.tag{font-size:12px;color:var(--warn);background:#ffb54714;border:1px solid #ffb54740;border-radius:999px;padding:4px 10px}
.strings{display:grid;gap:9px}
.str{position:relative;height:clamp(62px,8.6vh,78px);border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,#1a1f2e,#121622);color:var(--txt);font-weight:700;font-size:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .2s,border-color .25s,box-shadow .25s,background .25s;user-select:none;-webkit-user-select:none;min-width:0}
.str small{font-size:10px;color:var(--mut);font-weight:500;white-space:nowrap}
.str .pr{font-size:10px;color:var(--acc);font-weight:600}
.str .off{font-size:10.5px;color:var(--warn);font-weight:600}
.str:active{transform:scale(.95)}
.str.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 6px 20px #7c8cff40}
.str.hit{background:linear-gradient(180deg,#203a33,#122420);border-color:var(--ok);box-shadow:0 0 18px #2ee59d55}
.str.play:after{content:"";position:absolute;inset:-4px;border-radius:19px;border:2px solid var(--acc);animation:ring 1s ease-out infinite}
@keyframes ring{from{opacity:.9;transform:scale(.95)}to{opacity:0;transform:scale(1.12)}}
.many .str{font-size:16px}.many .str small{font-size:9px}
.ar{display:none;width:100%;border:0;background:none;color:var(--acc);font-size:14px;padding:5px 0;cursor:pointer;line-height:1}
.editing .str{height:auto;padding:3px 0;border-style:dashed;border-color:#3a4a7a;gap:0}.editing .ar{display:block}
.fine .ar{font-size:18px;font-weight:700;padding:3px 0}
.str.bump .ch{display:inline-block;animation:bump .25s}@keyframes bump{50%{transform:scale(1.3);color:var(--acc)}}
.hint{text-align:center;color:var(--mut);font-size:12px}.hint:empty{display:none}
.editbar{display:none;justify-content:center;gap:10px}.editbar.show{display:flex}
.start{width:100%;height:54px;border-radius:18px;border:0;font-weight:700;font-size:16px;color:#fff;cursor:pointer;background:linear-gradient(135deg,#7c8cff,#a86bff);box-shadow:0 10px 30px #7c8cff44;transition:transform .15s}
.start:active{transform:scale(.98)}.start.on{background:linear-gradient(135deg,#2a3145,#1e2433);box-shadow:none;color:var(--mut)}
.ad{margin:0 -20px;padding:10px 20px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#0e1119;display:flex;align-items:center;gap:10px}
.adbox{flex:1;height:50px;border:1px dashed #3a4256;border-radius:10px;display:grid;place-items:center;color:var(--dim);font-size:12px}
.rm{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:12px;padding:8px 11px;font-weight:600;font-size:12px;cursor:pointer;line-height:1.25}
/* sheets & modals */
.ov{position:fixed;inset:0;background:#000000b8;display:none;z-index:9;align-items:flex-end;justify-content:center}
.ov.show{display:flex}.ov.center{align-items:center;padding:20px}
.sheet{width:100%;max-width:480px;max-height:88dvh;overflow:auto;background:#131723;border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40%);opacity:0}}
.grab{width:40px;height:5px;border-radius:3px;background:#3a4256;margin:0 auto 12px}
.sheet h2{font-size:17px;margin:2px 0 12px}
.sheet h4{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin:18px 0 4px}
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}
.row:last-child{border-bottom:0}.row label{font-weight:600;font-size:15px}.row .d{display:block;color:var(--mut);font-size:12px;font-weight:400;margin-top:2px}
.sel2{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:9px;font-weight:600;font-size:14px;max-width:180px}
.step{display:flex;align-items:center;gap:6px}.step button{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:18px;cursor:pointer}
.step span{min-width:64px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.sw{position:relative;width:50px;height:30px;flex:none}.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;border-radius:999px;background:#2a3145;transition:.25s;cursor:pointer}.sw i:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.25s}
.sw input:checked+i{background:var(--ok)}.sw input:checked+i:before{transform:translateX(20px)}
.ilist{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ii{border:1px solid var(--line);background:linear-gradient(180deg,#1a1f2e,#121622);border-radius:16px;padding:12px;text-align:left;color:var(--txt);cursor:pointer;transition:.2s}
.ii b{display:block;font-size:15px}.ii span{display:block;color:var(--mut);font-size:12px;margin-top:2px}.ii em{display:block;font-style:normal;color:var(--dim);font-size:11px;margin-top:6px;letter-spacing:.3px}
.ii.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.modal{width:100%;max-width:400px;background:#151a27;border:1px solid var(--line);border-radius:22px;padding:20px;animation:pop .25s}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.modal h3{margin:0 0 6px;font-size:18px}.modal p{margin:0 0 14px;color:var(--mut);font-size:13.5px}
.modal input{width:100%;background:#0e1119;border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px;font-size:16px;outline:none}
.modal input:focus{border-color:var(--acc)}
.mbtns{display:flex;gap:10px;margin-top:16px;justify-content:flex-end}
.mbtns button{border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer;background:#232a3a;color:var(--txt)}
.mbtns .pri{background:var(--acc);color:#fff}.mbtns .danger{background:var(--bad);color:#fff}
.merr{color:var(--warn);font-size:12.5px;margin-top:8px;min-height:16px}
.ov.top{align-items:flex-start;padding-top:70px}
.res{max-height:52vh;overflow:auto;margin:10px -6px 0}
.ri{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 10px;border-radius:12px;cursor:pointer;text-decoration:none;color:inherit}
.ri:hover{background:#1e2435}.ri b{display:block;font-size:14.5px}.ri span{color:var(--mut);font-size:12.5px}
.ri .tg{font-size:11.5px;color:var(--acc);background:#7c8cff1a;border-radius:999px;padding:4px 9px;white-space:nowrap}.ri.web b{color:var(--acc)}
.ss h3{text-align:center;margin:0 0 2px}.ss p{text-align:center}
.ssrow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}.ssrow label{font-weight:600}
.pick{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}.pick button{min-width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:#0e1119;color:var(--mut);font-weight:700;cursor:pointer}.pick button.on{border-color:var(--acc);color:#fff;background:#7c8cff22}
/* metronome */
.bpm{text-align:center;font-size:72px;font-weight:800;letter-spacing:-2px;font-variant-numeric:tabular-nums;line-height:1}.bpm small{display:block;font-size:12px;color:var(--mut);letter-spacing:1px;font-weight:600;margin-top:4px}
.mrow{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px 0}
.mrow input[type=range]{flex:1;accent-color:var(--acc)}
.beats{display:flex;justify-content:center;gap:12px;margin:18px 0 6px}
.beat{width:18px;height:18px;border-radius:50%;background:#232a3a;transition:background .08s,transform .08s,box-shadow .08s}
.beat.a{width:22px;height:22px}.beat.lit{background:var(--acc);transform:scale(1.25);box-shadow:0 0 16px var(--acc)}.beat.a.lit{background:var(--ok);box-shadow:0 0 18px var(--ok)}
.mbig{width:100%;height:52px;border-radius:16px;border:0;font-weight:700;font-size:16px;color:#fff;background:linear-gradient(135deg,#7c8cff,#a86bff);cursor:pointer}
.mbig.on{background:#2a3145;color:var(--txt)}
.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:#222a3c;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-height:760px){.note{font-size:80px}.str{height:58px}.start{height:50px}}
@media (max-width:380px){.app{padding-left:16px;padding-right:16px}.ad{margin:0 -16px;padding-left:16px;padding-right:16px}.tunebar{gap:7px}.tb{padding:0 12px}.pill select{padding:0 28px 0 14px;font-size:13.5px}.pill:after{right:12px}.seg button{padding:7px 10px}}
/* ===== v8 Pro studio theme ===== */
:root{--bg:#1a1c20;--card:#2b2e33;--line:#0e0f11;--txt:#e3e7eb;--mut:#8a929c;--dim:#5d646d;--acc:#ff9f1a;--ok:#2ee59d;--warn:#ffb547;--bad:#ff5d50;
 --mono:"JetBrains Mono",ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Roboto Mono","DejaVu Sans Mono",monospace;--key:linear-gradient(180deg,#363a40,#282b30);--keyhi:inset 0 1px 0 #ffffff14}
html,body{background:linear-gradient(180deg,#26292e,#18191d) fixed;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.instbtn b{text-transform:uppercase;letter-spacing:.08em;font-size:15px}.instbtn span{font-family:var(--mono);font-size:11px}
.iconbtn{background:var(--key);border:1px solid #0e0f11;border-radius:7px;box-shadow:var(--keyhi)}.iconbtn.on{color:var(--acc);border-color:#0e0f11;box-shadow:var(--keyhi),inset 0 -2px 0 var(--acc)}
.seg{background:#111316;border:1px solid #000;border-radius:7px}
.seg button{border-radius:5px;font-family:var(--mono);text-transform:uppercase;font-size:11.5px;letter-spacing:.04em;color:#7c848f}
.seg button.on{background:#3a3e45;color:var(--acc);box-shadow:inset 0 1px 0 #ffffff12}
.vbtn{border-radius:7px!important;background:var(--key)!important;border:1px solid #0e0f11!important;font-family:var(--mono);text-transform:uppercase;font-size:11px!important;color:var(--mut)!important}
.vbtn.on{color:var(--acc)!important;box-shadow:inset 0 -2px 0 var(--acc)}
.hero{background:#0d0f11;border:1px solid #000;border-radius:10px;box-shadow:inset 0 2px 12px #000,0 1px 0 #ffffff10;padding:14px 12px clamp(10px,1.8vh,18px);margin-top:12px;justify-content:center}
.note{font-family:var(--mono);font-weight:700;letter-spacing:-2px;color:#e8ecf0;text-shadow:none}
.note sub{font-family:var(--mono);color:#7c848f}
.in .note{color:#e8ecf0;text-shadow:0 0 18px #2ee59d55}
.cbar{max-width:none}.ctrack{display:none}
.leds{display:flex;gap:2px;height:26px}.leds i{flex:1;background:#24282d;border-radius:1.5px;transition:background .06s}
.leds i.g{background:var(--ok);box-shadow:0 0 6px #2ee59daa}.leds i.y{background:#ffb547;box-shadow:0 0 6px #ffb547aa}.leds i.r{background:var(--bad);box-shadow:0 0 6px #ff5d50aa}
.leds i.c{background:#5a3c12}.leds i.c.on{background:var(--acc);box-shadow:0 0 7px var(--acc)}
.clbl{font-family:var(--mono);font-size:10px;color:var(--dim)}
.strobe{max-width:none;border-radius:4px;border:1px solid #000;background:#111316}
.in .strobe{border-color:#000;box-shadow:0 0 14px #2ee59d33}
.meta{font-family:var(--mono);font-size:13px;color:var(--ok);background:#16191c;border:1px solid #000;border-radius:4px;padding:6px 10px;align-self:stretch;text-align:center}
.status{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.pill select{border-radius:7px;background:var(--key);border:1px solid #0e0f11;box-shadow:var(--keyhi);font-family:var(--mono);text-transform:uppercase;font-size:12.5px}
.pill select:focus{border-color:var(--acc)}
.tb{border-radius:7px;background:var(--key);border:1px solid #0e0f11;box-shadow:var(--keyhi);font-family:var(--mono);text-transform:uppercase;font-size:11.5px}
.tb.on{background:#3a3e45;border-color:#0e0f11;color:var(--acc);box-shadow:inset 0 -2px 0 var(--acc)}
.tb.save{background:linear-gradient(180deg,#36d69a,#1fa974);color:#08251a}
.tb.fine.on{background:#3a3e45;color:var(--warn);border-color:#0e0f11}
.tag{font-family:var(--mono);border-radius:4px!important;background:#ff9f1a1a!important;color:var(--acc)!important;border-color:#ff9f1a55!important}
.str{border-radius:7px;border:1px solid #0e0f11;background:var(--key);box-shadow:var(--keyhi);font-family:var(--mono);padding-top:8px}
.str:before{content:"";position:absolute;top:6px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#0e0f11;box-shadow:inset 0 1px 1px #000}
.str small,.str .pr,.str .off{font-family:var(--mono)}.str .pr{color:var(--acc)}
.str.sel{border-color:#0e0f11;box-shadow:var(--keyhi),inset 0 0 0 1px var(--acc)}.str.sel:before{background:var(--acc);box-shadow:0 0 6px var(--acc)}
.str.hit{background:linear-gradient(180deg,#2c3a35,#222a27);border-color:#0e0f11;box-shadow:var(--keyhi)}.str.hit:before{background:var(--ok);box-shadow:0 0 7px var(--ok)}
.str.play:after{border-radius:9px;border-color:var(--acc)}
.strings.editing .str{border:1px dashed #5a3c12;padding-top:3px}.strings.editing .str:before{display:none}
.ar{font-family:var(--mono);color:var(--acc)!important}
.start{border-radius:7px;background:linear-gradient(180deg,#ffad33,#e68600);color:#1a1c20;font-family:var(--mono);text-transform:uppercase;letter-spacing:.12em;font-size:15px;border:1px solid #000;box-shadow:inset 0 1px 0 #ffffff55,0 6px 18px #ff9f1a22}
.start.on{background:var(--key);color:var(--acc);box-shadow:var(--keyhi)}
.adbox,.ad{background:#111316;border-color:#000!important;font-family:var(--mono)}
.rm{border-radius:5px!important;background:var(--key)!important;border:1px solid #000!important}
.ov{background:#000000c8}
.sheet{background:linear-gradient(180deg,#2a2d32,#1f2125);border:1px solid #000;border-bottom:0;border-radius:12px 12px 0 0;box-shadow:inset 0 1px 0 #ffffff14}
.sheet h2{text-transform:uppercase;letter-spacing:.08em;font-size:14px}.sheet h4{font-family:var(--mono);color:var(--acc);font-size:10.5px}

<script>
// ===== Fretlight pitch core (portable, no DOM) =====
const NOTE_NAMES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
function midiToFreq(m,a4=440){return a4*Math.pow(2,(m-69)/12);}

function centsBetween(f,ref){return 1200*Math.log2(f/ref);}
// YIN on a mono buffer. Returns {freq, clarity, rms} or null.
function yin(buf,sr,thr=0.12,minF=60,maxF=1400){
  const N=buf.length,W=Math.floor(N/2);let rms=0;for(let i=0;i<N;i++)rms+=buf[i]*buf[i];rms=Math.sqrt(rms/N);
  const tMin=Math.max(2,Math.floor(sr/maxF)),tMax=Math.min(W-2,Math.ceil(sr/minF));if(tMax<=tMin)return null;
  const d=new Float32Array(tMax+2);
  for(let t=1;t<=tMax+1;t++){let s=0;for(let i=0;i<W;i++){const x=buf[i]-buf[i+t];s+=x*x;}d[t]=s;}
  let run=0;d[0]=1;for(let t=1;t<=tMax+1;t++){run+=d[t];d[t]=run?d[t]*t/run:1;}
  let tau=-1;for(let t=tMin;t<=tMax;t++){if(d[t]<thr){while(t+1<=tMax&&d[t+1]<d[t])t++;tau=t;break;}}
  if(tau<0)return null;
  const a=d[tau-1],b=d[tau],c=d[tau+1],den=a+c-2*b;const tt=den?tau+(a-c)/(2*den):tau;
  return{freq:sr/tt,clarity:Math.max(0,1-b),rms};
}
// Range-aware detector: decimates for very low instruments to keep cost bounded.
function detect(buf,sr,opt={}){
  const minF=opt.minF||60,maxF=opt.maxF||1400,gate=opt.gate??0.008,minClarity=opt.minClarity??0.85;
  let x=buf,rate=sr;const dec=minF<70&&maxF<700?2:1;

 const res=detect(buf,ac.sampleRate,{minF:r.minF,maxF:r.maxF,gate:S.gate,minClarity:S.clar});
 if(res){const med=smoother.size()?smoother.push(res.freq):res.freq;if(!smoother.size())smoother.push(res.freq);
  if(Math.abs(centsBetween(res.freq,med))>60){smoother.reset();smoother.push(res.freq);update(res.freq);}else update(med);st.lastHit=performance.now();}
 else if(performance.now()-st.lastHit>1200)clearReading();}
function clearReading(){if(!st.live)return;st.live=false;st.cents=0;smoother.reset();$('status').textContent='';$('gw').classList.remove('in');document.querySelectorAll('.str.hit').forEach(e=>e.classList.remove('hit'));hold.start=0;hold.key=null;}
function resolveTarget(f){const fm=freqToMidi(f,st.a4);
 if(st.mode==='chrom'){const m=Math.round(fm);return{i:-1,midi:m,eff:m};}
 let c=candidates();if(st.mode==='manual')c=c.filter(x=>x.i===st.sel);
 return c.reduce((a,b)=>Math.abs(b.eff-fm)<Math.abs(a.eff-fm)?b:a);}
function update(f,now=performance.now()){const t=resolveTarget(f),c=centsBetween(f,midiToFreq(t.eff,st.a4));st.cents=c;st.live=true;const inT=Math.abs(c)<=5;
 const off=t.i>=0?st.off[t.i]:0;
 $('note').innerHTML=`${nm(t.midi)}<sub>${oc(t.midi)}${off?' '+fmtC(off):''}</sub>`;
 $('meta').textContent=`${off?'target '+midiToFreq(t.eff,st.a4).toFixed(1)+' Hz · ':''}${f.toFixed(1)} Hz · ${c>0?'+':''}${c.toFixed(0)} cents`;
 const s=$('status');s.textContent=inT?'IN TUNE':Math.abs(c)>50?(c<0?'Way too low — tighten':'Way too high — loosen'):(c<0?'Tune up ↑':'Tune down ↓');s.style.color=inT?'var(--ok)':Math.abs(c)<20?'var(--warn)':'var(--bad)';
 $('gw').classList.toggle('in',inT);document.querySelectorAll('.str').forEach((b,i)=>b.classList.toggle('hit',i===t.i&&inT));
 // chime when held in tune ~0.5 s; no retrigger until it leaves tune or the target changes
 const key=t.i+':'+t.midi;if(key!==hold.key){hold.key=key;hold.start=0;hold.chimed=null;}
 if(inT){if(!hold.start)hold.start=now;if(now-hold.start>=500&&hold.chimed!==key){hold.chimed=key;if(st.chime)chime();}}
 else{hold.start=0;if(Math.abs(c)>12)hold.chimed=null;}
 return{target:t,cents:c,inTune:inT};}
// ---- LED segment meter: 41 segments x 2.5 cents, amber centre, green when in tune ----
const LEDN=41;$('leds').innerHTML=Array.from({length:LEDN},(_,k)=>`<i${k===20?' class="c"':''}></i>`).join('');const ledEls=[...$('leds').children];let ledKey='';
function ledState(c,live){const out=Array(LEDN).fill('');out[20]=live?'c on':'c';if(!live)return out;const v=clamp(Math.round(c/2.5),-20,20),cls=Math.abs(c)<=5?'g':Math.abs(c)<20?'y':'r';
 const a=Math.min(20,20+v),b=Math.max(20,20+v);for(let k=a;k<=b;k++)if(k!==20)out[k]=cls;if(v===0){out[19]=out[21]='g';}return out;}
function drawLeds(){const s=ledState(st.shown,st.live),key=s.join();if(key===ledKey)return;ledKey=key;ledEls.forEach((e,k)=>e.className=s[k]);}
// ---- strobe ----
let sPhase=0,lastT=performance.now();
function drawStrobe(dt){const cv=$('strobe');if(!st.strobe||!cv.offsetWidth)return;const w=cv.offsetWidth,h=cv.offsetHeight,dpr=devicePixelRatio||1;
 if(cv.width!==w*dpr){cv.width=w*dpr;cv.height=h*dpr;}const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
 const c=st.live?clamp(st.cents,-50,50):0;sPhase+=c*dt*2.2;const inT=st.live&&Math.abs(c)<=5;const P=14;
 for(let row=0;row<3;row++){const y=row*h/3,sp=(row+1);const ph=((sPhase*sp)%P+P)%P;
  g.fillStyle=inT?'#2ee59d':(st.live?(Math.abs(c)<20?'#ffb547':'#ff5d50'):'#2a2e34');g.globalAlpha=st.live?(0.95-row*0.22):0.6;
  for(let x=-P+ph;x<w;x+=P)g.fillRect(x,y+1,P/2,h/3-2);}g.globalAlpha=1;}
// ---- loop ----
function frame(){requestAnimationFrame(frame);const now=performance.now(),dt=Math.min(.1,(now-lastT)/1000);lastT=now;processFrame();
 st.shown+=((st.live?st.cents:0)-st.shown)*.18;$('needle').style.left=(50+clamp(st.shown,-50,50))+'%';drawLeds();drawStrobe(dt);metVisual();}
// ---- metronome (look-ahead Web Audio scheduler) ----
const met={bpm:clamp(prefs.bpm,30,250),beats:prefs.beats,on:false,next:0,beat:0,timer:null,queue:[],taps:[]};
function metRender(){$('bpmv').textContent=met.bpm;$('bpmr').value=met.bpm;$('beatsSeg').innerHTML=[2,3,4,5,6].map(b=>`<button data-b="${b}" class="${b===met.beats?'on':''}">${b}/4</button>`).join('');
 $('beats').innerHTML=Array.from({length:met.beats},(_,i)=>`<div class="beat${i===0?' a':''}"></div>`).join('');$('mstart').textContent=met.on?'Stop':'Start';$('mstart').classList.toggle('on',met.on);$('metbtn').classList.toggle('on',met.on);}
function setBpm(v){met.bpm=clamp(Math.round(v),30,250);metRender();savePrefs();}
function click(t,accent){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=accent?1760:1100;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(accent?.5:.3,t+.002);g.gain.exponentialRampToValueAtTime(.0008,t+.05);o.start(t);o.stop(t+.06);}
function schedule(){while(met.next<ac.currentTime+0.12){click(met.next,met.beat===0);met.queue.push({t:met.next,b:met.beat});met.next+=60/met.bpm;met.beat=(met.beat+1)%met.beats;}}
function metToggle(){ensureAC();met.on=!met.on;if(met.on){met.beat=0;met.next=ac.currentTime+0.06;met.queue=[];schedule();met.timer=setInterval(schedule,25);}else{clearInterval(met.timer);met.queue=[];document.querySelectorAll('.beat').forEach(b=>b.classList.remove('lit'));}metRender();}
let litBeat=-1;
function metVisual(){if(!met.on||!ac)return;let cur=null;while(met.queue.length&&met.queue[0].t<=ac.currentTime){cur=met.queue.shift();}
 if(cur){litBeat=cur.b;const bs=document.querySelectorAll('.beat');bs.forEach((b,i)=>b.classList.toggle('lit',i===cur.b));setTimeout(()=>bs[cur.b]&&bs[cur.b].classList.remove('lit'),Math.min(140,30000/met.bpm));}}
function tapTempo(now=performance.now()){met.taps=met.taps.filter(t=>now-t<2500);met.taps.push(now);if(met.taps.length>=2){const iv=[];for(let i=1;i<met.taps.length;i++)iv.push(met.taps[i]-met.taps[i-1]);const avg=iv.slice(-4).reduce((a,b)=>a+b,0)/Math.min(4,iv.length);setBpm(60000/avg);}}
$('metbtn').onclick=()=>{metRender();show('metov',true)};
$('bm').onclick=()=>setBpm(met.bpm-1);$('bp').onclick=()=>setBpm(met.bpm+1);$('bpmr').oninput=e=>setBpm(+e.target.value);
$('beatsSeg').onclick=e=>{const b=+e.target.dataset.b;if(b){met.beats=b;met.beat=0;metRender();savePrefs();}};
$('tap').onclick=()=>tapTempo();$('mstart').onclick=metToggle;
// ---- boot ----
st.tun=Object.keys(I().presets)[0];selectTuning('p:'+st.tun);metRender();frame();

</script></body></html>
